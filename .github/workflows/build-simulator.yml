name: Build IPA for Sideloading

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build Unsigned iOS Archive
      run: |
        xcodebuild -scheme "Lyrix" \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   clean build

    - name: Package .ipa File
      run: |
        APP_PATH=$(find build -name "Lyrix.app" -type d | head -n 1)
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        zip -r Lyrix.ipa Payload

    - name: Upload .ipa Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Lyrix-Sideload-IPA
        path: Lyrix.ipa
