name: Build Simulator App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build for iOS Simulator
      run: |
        xcodebuild -scheme "Lyrix" \
                   -sdk iphonesimulator \
                   -derivedDataPath build \
                   clean build

    - name: Package .app directly for Appetize
      run: |
        APP_PATH=$(find build -name "Lyrix.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "Lyrix.app not found!"
          exit 1
        fi
        echo "Found app at: $APP_PATH"
        cp -R "$APP_PATH" ./Lyrix.app
        zip -r appetize-build.zip Lyrix.app

    - name: Upload Zip Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Lyrix-Appetize-Direct
        path: appetize-build.zip
