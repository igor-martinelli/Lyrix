name: Build Simulator App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build for iOS Simulator
      run: |
        xcodebuild -scheme "Lyrix" \
                   -sdk iphonesimulator \
                   -derivedDataPath build \
                   clean build

    - name: Find and Zip .app Bundle
      run: |
        APP_PATH=$(find build -name "Lyrix.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "Lyrix.app not found!"
          exit 1
        fi
        cd "$(dirname "$APP_PATH")"
        zip -r Lyrix.app.zip Lyrix.app
        echo "Zipped app located at: $(pwd)/Lyrix.app.zip"

    - name: Upload .app as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Appetize-Simulator-Build
        path: build/**/Lyrix.app.zip
