name: Build Simulator App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build for iOS Simulator
      run: |
        xcodebuild -scheme "Lyrix" \
                   -sdk iphonesimulator \
                   -configuration Release \
                   -derivedDataPath build \
                   clean build

    - name: Zip .app Bundle
      run: |
        cd build/Build/Products/Release-iphonesimulator/
        zip -r YourApp.app.zip *.app

    - name: Upload .app as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Appetize-Simulator-Build
        path: build/Build/Products/Release-iphonesimulator/Lyrix.app.zip
